<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Black Fern Are You?</title>
<style>html,body{margin:0;padding:0;background:transparent;}</style>
</head>
<body>

<!-- NZ Herald interactive, running in its own clean document so the host
     page's CSS and layout can't interfere with it. -->
<div class="nzh-datavis nzh-datavis-sports-interactive" id="quiz">
<script>
{
  const element = document.currentScript.parentElement;
  import("https://insights.nzherald.co.nz/apps/interactives/2025/08/which-black-fern/quiz/index.embed.js").then(({embed}) => embed(element));
}
</script>
</div>

<script>
// Report the content height to the parent page so it can size this iframe to
// fit the quiz (which changes height between questions).
(function () {
  var last = 0;
  function post() {
    var h = Math.ceil(Math.max(document.body.scrollHeight, document.documentElement.scrollHeight));
    if (h > 0 && h !== last) {
      last = h;
      parent.postMessage({ type: "quiz-height", height: h }, "*");
    }
  }
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.body);
  window.addEventListener("load", post);
  // Safety net for late layout changes the observer might miss.
  setInterval(post, 500);
})();
</script>

</body>
</html>
