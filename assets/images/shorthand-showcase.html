<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deep Trouble — immersive feature</title>
<style>
  html,body{ margin:0; padding:0; background:#111; }
  html{ -webkit-overflow-scrolling:touch; }
  /* Persistent "back to the site" button — fixed top-right so it stays put as
     the story scrolls. Makes the story feel part of the site and gives an easy
     way home, especially on mobile. */
  .sh-close{
    position:fixed;
    top:16px; right:16px;
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    background:#323640; color:#fcfcfa;
    border:0; border-radius:50%;
    cursor:pointer;
    z-index:2147483647;
    box-shadow:0 2px 10px rgba(0,0,0,.45);
    -webkit-tap-highlight-color:transparent;
  }
  .sh-close svg{ display:block; }
</style>
</head>
<body>
<button class="sh-close" type="button" onclick="closeStory()" aria-label="Close and return to the site">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18"></path></svg>
</button>
<script>
function closeStory(){
  // Close the tab if the browser allows it; otherwise return to the homepage.
  window.close();
  setTimeout(function(){ if(!window.closed){ window.location.replace('/'); } }, 150);
}
</script>
<script src="https://embed.shorthand.com/embed_10.js"></script>
<div data-shorthand-embed="https://www.nzherald.co.nz/indepth/news/deep-trouble/"></div>
</body>
</html>
