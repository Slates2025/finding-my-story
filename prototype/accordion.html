<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accordion Prototype</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="accordion.css">

</head>

<body>

<div class="wrapper">

    <section class="accordion">

        <div class="accordion-grid">

            <button class="accordion-toggle" aria-label="Toggle chapter">

    <svg
        class="accordion-icon"
        viewBox="0 0 126.29 121.53"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true">

        <path
            d="M101.17,40.82h-14.21c-1.71,0-3.1-1.39-3.1-3.1v-14.21c0-11.21-9.09-20.3-20.3-20.3s-20.3,9.09-20.3,20.3v14.21c0,1.71-1.39,3.1-3.1,3.1h-14.21c-11.21,0-20.3,9.09-20.3,20.3s9.09,20.3,20.3,20.3h14.21c1.71,0,3.1,1.39,3.1,3.1v14.21c0,11.21,9.09,20.3,20.3,20.3s20.3-9.09,20.3-20.3v-14.21c0-1.71,1.39-3.1,3.1-3.1h14.21c11.21,0,20.3-9.09,20.3-20.3s-9.09-20.3-20.3-20.3Z"
            fill="currentColor"/>

    </svg>

</button>

            <div class="accordion-main">

                <h2 class="accordion-title">

                    I think by making

                </h2>

                <div class="accordion-content">

                    <div class="accordion-rule"></div>

                    <p>

                        Every important project in my career has started as a
                        sketch, prototype or experiment. I rarely wait for
                        perfect ideas. I make something, learn from it,
                        improve it and repeat.

                    </p>

                </div>

            </div>

        </div>

    </section>

</div>

<script src="accordion.js"></script>

</body>

</html>
